[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "1.3.0"
description = "NEXUS — a zero-dependency terminal mission control for Linux (CPU, RAM, GPU, disks, network)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "jake1402" }]
keywords = ["monitor", "terminal", "tui", "system-monitor", "linux", "dashboard"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
nexus = "nexus:main"

[tool.setuptools]
py-modules = ["nexus"]
